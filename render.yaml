# Chrome ↔ Edge sync needs this Node Web Service (/api/ops).
# Do NOT use Render Static Site — BroadcastChannel only works in the same browser.
services:
  - type: web
    name: ganderosa
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
